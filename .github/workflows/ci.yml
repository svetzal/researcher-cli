name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest

      - name: Security audit
        # CVE-2026-45829 / PYSEC-2026-311: ChromaDB Python server pre-auth code execution.
        # CVE-2026-45830, CVE-2026-45831, CVE-2026-45833: ChromaDB server-mode multi-tenant
        # authorization/RBAC bypass and code injection via the HTTP API.
        # researcher-cli embeds ChromaDB SDK functionality via PersistentClient and does not
        # run or allow a Chroma server mode, so none of these server/auth vulnerabilities are
        # reachable. PYSEC-2026-311 is the PYSEC alias for CVE-2026-45829. Remove each ignore
        # once a patched ChromaDB package is available.
        run: uv run pip-audit --ignore-vuln CVE-2026-45829 --ignore-vuln PYSEC-2026-311 --ignore-vuln CVE-2026-45830 --ignore-vuln CVE-2026-45831 --ignore-vuln CVE-2026-45833
