name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest

      - name: Security audit
        # CVE-2026-45829 / PYSEC-2026-311: ChromaDB Python server pre-auth code execution.
        # researcher-cli embeds ChromaDB SDK functionality via PersistentClient and does not
        # run or allow a Chroma server mode. PYSEC-2026-311 is the PYSEC alias for the same
        # underlying vulnerability. Remove both once a patched ChromaDB package is available.
        run: uv run pip-audit --ignore-vuln CVE-2026-45829 --ignore-vuln PYSEC-2026-311
