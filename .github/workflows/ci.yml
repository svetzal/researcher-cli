name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest

      - name: Security audit
        # CVE-2026-4539: ReDoS in pygments AdlLexer (archetype.py), local-access only,
        # no upstream fix available yet. Remove --ignore-vuln when pygments >2.19.2 ships a fix.
        run: uv run pip-audit --ignore-vuln CVE-2026-4539
