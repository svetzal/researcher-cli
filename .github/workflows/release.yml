name: Release

on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest

      - name: Security audit
        # CVE-2026-4539: ReDoS in pygments AdlLexer (archetype.py), local-access only,
        # no upstream fix available yet. Remove --ignore-vuln when pygments >2.19.2 ships a fix.
        # CVE-2026-45829: ChromaDB Python server pre-auth code execution. researcher-cli
        # embeds ChromaDB SDK functionality via PersistentClient and does not run or allow
        # a Chroma server mode. Remove once a patched ChromaDB package is available.
        # CVE-2025-3000: segfault in torch.jit.script when scripting a class with a list
        # attribute. torch is transitive (docling-ibm-models); researcher-cli never calls
        # torch.jit.script/TorchScript, and the bug is a local low-impact crash, not an
        # attacker-input path. No upstream fix exists. Remove once a patched torch ships or
        # if researcher-cli ever uses TorchScript.
        run: uv run pip-audit --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-45829 --ignore-vuln CVE-2025-3000

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md
          awk '/^## \['"${{ steps.version.outputs.version }}"'\]/{found=1; next} /^## \[/{found=0} found' CHANGELOG.md > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: false
